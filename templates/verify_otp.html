<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aradhana Catalogue Studio — Verify</title>
<style>
:root { --accent:#6d5ef8; --accent2:#8b7cfa; --bg:#0d0e17; --card:#141623; --field:#1a1d2e; --border:#242840; --text:#e4e7f5; --muted:#8188a8; --danger:#fb7185; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:36px 32px; width:100%; max-width:390px; }
.logo { width:48px; height:48px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:900; margin:0 auto 18px; }
h1 { font-size:17px; text-align:center; margin-bottom:8px; }
.sub { font-size:12px; color:var(--muted); text-align:center; margin-bottom:24px; line-height:1.5; }
label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
input { width:100%; background:var(--field); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:22px; letter-spacing:6px; text-align:center; color:var(--text); margin-bottom:16px; }
input:focus { outline:none; border-color:var(--accent); }
button { width:100%; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:0; border-radius:10px; padding:13px; font-size:15px; font-weight:700; color:#fff; cursor:pointer; }
.error { background:rgba(251,113,133,.12); border:1px solid rgba(251,113,133,.35); color:var(--danger); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:16px; }
.back { display:block; text-align:center; margin-top:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">AJ</div>
  <h1>Check your email</h1>
  <div class="sub">A six-digit code was sent to {{ email }}.<br>It expires in 10 minutes.</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label for="code">Verification code</label>
    <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required>
    <button type="submit">Verify and sign in</button>
  </form>
  <a class="back" href="{{ url_for('login') }}">Start again</a>
</div>
</body>
</html>
