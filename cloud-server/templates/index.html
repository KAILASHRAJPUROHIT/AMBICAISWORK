<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aradhana Jewellers | Boisar</title>
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #23519D;
            --primary-gold: #CCA137;
            --accent-gold: #F7CA5B;
            --ivory: #FDFCF0;
            --white: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-muted: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--brand-blue);
            /* Premium textured background */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.15) 0%, transparent 75%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 0 L70 50 L120 60 L70 70 L60 120 L50 70 L0 60 L50 50 Z' fill='%23ffffff' fill-opacity='0.03'/%3E%3C/svg%3E");
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
            color: var(--text-dark);
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        /* Luxury Card Base */
        .luxury-card {
            background-color: var(--ivory);
            border: 1px solid var(--primary-gold);
            border-radius: 2px;
            padding: 50px 25px 35px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            position: relative;
            text-align: center;
        }

        /* Ornate Corner Details */
        .luxury-card::before, .luxury-card::after,
        .corner-bottom-left, .corner-bottom-right {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--primary-gold);
            z-index: 5;
        }

        .luxury-card::before { top: -6px; left: -6px; border-right: none; border-bottom: none; }
        .luxury-card::after { top: -6px; right: -6px; border-left: none; border-bottom: none; }
        .corner-bottom-left { bottom: -6px; left: -6px; border-right: none; border-top: none; }
        .corner-bottom-right { bottom: -6px; right: -6px; border-left: none; border-top: none; }

        /* Logo Area */
        .logo-section {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
        }

        .brand-logo {
            width: 190px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        /* Hero Text */
        .hero-section {
            margin-bottom: 45px;
            padding: 0 10px;
        }

        .hero-heading {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--brand-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero-subheading {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        /* Luxury Action Cards */
        .action-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .action-card {
            display: flex;
            align-items: center;
            background: var(--white);
            border: 1px solid rgba(204, 161, 55, 0.2);
            padding: 16px 20px;
            text-decoration: none;
            color: var(--brand-blue);
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .action-card::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background-color: var(--brand-blue);
            border-radius: 4px 0 0 4px;
        }

        .action-card:active {
            transform: translateY(2px);
            background-color: var(--ivory);
            border-color: var(--primary-gold);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .icon-box {
            width: 44px;
            height: 44px;
            background-color: var(--brand-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 18px;
            flex-shrink: 0;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 4px 10px rgba(35, 81, 157, 0.2);
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-gold);
        }

        .action-label {
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            text-align: left;
        }

        /* Footer */
        .card-footer {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid rgba(204, 161, 55, 0.2);
        }

        .footer-tagline {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: var(--primary-gold);
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Desktop Adjustments */
        @media (min-width: 421px) {
            .brand-logo { width: 230px; }
            .hero-heading { font-size: 28px; }
            .luxury-card { padding: 60px 35px 45px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="luxury-card">
            <!-- Corners -->
            <div class="corner-bottom-left"></div>
            <div class="corner-bottom-right"></div>

            <header class="logo-section">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Aradhana Jewellers" class="brand-logo">
            </header>

            <section class="hero-section">
                <h1 class="hero-heading">Welcome to Aradhana Jewellers</h1>
                <p class="hero-subheading">Your trusted jewellery destination in Boisar.</p>
            </section>

            <nav class="action-list">
                <!-- Google Review -->
                <a href="https://g.page/r/CZSjxdw4AdaxEBM/review" class="action-card" target="_blank">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </div>
                    <span class="action-label">Review Us on Google</span>
                </a>

                <!-- Print Documents -->
                <a href="/print" class="action-card">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                    </div>
                    <span class="action-label">Print Documents</span>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/aradhanajewellers.boisar/" class="action-card" target="_blank">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
                    </div>
                    <span class="action-label">Visit Instagram</span>
                </a>

                <!-- Facebook -->
                <a href="https://www.facebook.com/people/Aradhana-Jewellers-Boisar/61573284677105/" class="action-card" target="_blank">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><path d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5 3.66 9.15 8.44 9.9v-7h-2.54v-2.9h2.54v-2.2c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02z"/></svg>
                    </div>
                    <span class="action-label">Visit Facebook</span>
                </a>
            </nav>

            <footer class="card-footer">
                <p class="footer-tagline">Trust • Purity • Craftsmanship</p>
            </footer>
        </div>
    </div>

</body>
</html>
