<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aradhana Jewellers | Smart Scan & Print</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        :root {
            --navy: #06142E;
            --navy-light: #112244;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --bg-color: #F7F5F0;
            --text-light: #FFFFFF;
            --error: #E74C3C;
            --success: #27AE60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-action {
            background: var(--navy-light);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 20px 10px;
            color: var(--gold-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 100px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-action:active {
            transform: scale(0.95);
            background: rgba(212, 175, 55, 0.1);
        }

        .btn-action span { font-size: 32px; }
        .btn-action strong { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        .header { text-align: center; margin: 10px 0; }
        .header h1 { color: var(--navy); font-family: Georgia, serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: var(--navy);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(6, 20, 46, 0.2);
            color: white;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Debug UI */
        .debug-overlay {
            display: {% if production_mode %}none{% else %}block{% endif %};
            position: absolute;
            top: 60px; left: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 10px;
            border-radius: 8px;
            z-index: 110;
            pointer-events: none;
            max-width: 250px;
            line-height: 1.4;
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .debug-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(0, 255, 0, 0.1); padding: 2px 0; }
        .debug-val { color: #fff; font-weight: bold; }

        /* Queue UI */
        .queue-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 120px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .queue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }

        .queue-item {
            position: relative;
            aspect-ratio: 3/4;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .queue-item img { width: 100%; height: 100%; object-fit: contain; }

        .queue-item .pdf-icon {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--gold);
            flex-direction: column;
            gap: 4px;
        }

        .queue-item .pdf-icon small {
            font-size: 10px;
            color: #aaa;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            padding: 0 4px;
        }

        .btn-remove {
            position: absolute;
            top: 2px; right: 2px;
            background: var(--error);
            color: white;
            border: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            font-size: 15px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5;
        }

        /* Camera View */
        .camera-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1000;
            display: flex; flex-direction: column;
        }

        .camera-container { position: relative; flex: 1; overflow: hidden; }

        #camera-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        #detection-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            z-index: 100;
            pointer-events: none;
        }

        .camera-guide {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .camera-guide.guide-locked {
            background: rgba(39, 174, 96, 0.85);
            color: #fff;
            font-weight: bold;
        }

        /* Auto-capture ring */
        #autocapture-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            z-index: 105;
            pointer-events: none;
            display: none;
        }

        #autocapture-ring.visible { display: block; }
        #autocapture-ring.flash { background: rgba(212,175,55,0.4); }

        .camera-controls {
            height: 120px;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .btn-shutter {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 5px solid white;
            background: transparent;
            position: relative;
            cursor: pointer;
        }

        .btn-shutter::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            background: white;
            border-radius: 50%;
        }

        .btn-camera-cancel { color: white; background: transparent; border: none; font-size: 16px; cursor: pointer; }

        /* Crop View */
        .crop-wrapper { display: flex; flex-direction: column; gap: 15px; }

        .crop-container {
            width: 100%;
            height: auto;
            max-height: 60vh;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 10px;
        }

        #crop-image {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            display: block;
        }

        /* Print Options */
        .section-label { font-size: 12px; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: block; }

        .print-types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

        .type-card input { display: none; }
        .type-content {
            background: var(--navy-light);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 12px 10px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .type-content .mode-icon { font-size: 24px; }
        .type-content .mode-desc { font-size: 10px; color: #aaa; margin-top: 2px; }

        .type-card input:checked + .type-content {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.15);
        }
        .type-card input:checked + .type-content .mode-desc { color: var(--gold-light); }

        .btn-master {
            background: linear-gradient(135deg, #D4AF37 0%, #C5A059 100%);
            color: var(--navy);
            border: 0;
            border-radius: 12px;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }

        .btn-master:disabled { background: #444; color: #777; box-shadow: none; cursor: not-allowed; }

        .loader-overlay { text-align: center; padding: 40px 0; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.1);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #cv-loading-bar {
            position: fixed;
            bottom: 0; left: 0; width: 0%;
            background: var(--gold);
            height: 3px;
            z-index: 2000;
            transition: width 0.3s;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background: #1a1a2e;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            border-left: 4px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            width: 100%;
            text-align: center;
        }

        .toast.error { border-left-color: var(--error); }
        .toast.success { border-left-color: var(--success); }

        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>

<div id="cv-loading-bar"></div>
<div id="toast-container"></div>

<div class="header">
    <h1>Aradhana</h1>
</div>

<div class="container">

    <!-- MAIN VIEW -->
    <div id="view-main" class="card">
        <div class="action-buttons">
            <div class="btn-action" onclick="startCamera()">
                <span>📷</span>
                <strong>Scan Document</strong>
            </div>
            <div class="btn-action" onclick="triggerFileInput()">
                <span>📁</span>
                <strong>Upload Files</strong>
            </div>
            <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.pdf" class="hidden" onchange="handleFileSelect(event)">
        </div>

        <div class="queue-container">
            <div class="queue-header">
                <span>Print Queue</span>
                <span id="queue-count">0 Items</span>
            </div>
            <div id="queue-grid" class="queue-grid"></div>
            <div id="queue-empty" style="text-align: center; color: #888; padding: 20px;">
                No documents added yet.
            </div>
        </div>

        <div class="options">
            <span class="section-label">Print Mode</span>
            <div class="print-types">
                <label class="type-card">
                    <input type="radio" name="print-mode" value="pdf">
                    <div class="type-content">
                        <span class="mode-icon">📄</span>
                        <strong>Full Page</strong>
                        <span class="mode-desc">One image per A4 page</span>
                    </div>
                </label>
                <label class="type-card">
                    <input type="radio" name="print-mode" value="id_card" checked>
                    <div class="type-content">
                        <span class="mode-icon">🪪</span>
                        <strong>ID Cards</strong>
                        <span class="mode-desc">6 cards per A4 sheet</span>
                    </div>
                </label>
            </div>

            <span class="section-label">Copies</span>
            <select id="copies-select" style="width:100%; padding: 12px; border-radius: 8px; margin-bottom: 20px; background: var(--navy-light); color: white; border: 1px solid var(--gold);">
                <option value="1">1 Copy</option>
                <option value="2">2 Copies</option>
                <option value="3">3 Copies</option>
                <option value="4">4 Copies</option>
                <option value="5">5 Copies</option>
            </select>
        </div>

        <button id="btn-submit-all" class="btn-master" onclick="submitAll()" disabled>
            Send All For Printing
        </button>
    </div>

    <!-- CAMERA VIEW -->
    <div id="view-camera" class="camera-wrapper hidden">
        <div class="camera-container">
            <video id="camera-video" autoplay playsinline muted></video>
            <canvas id="detection-overlay"></canvas>
            <div id="camera-debug-overlay" class="debug-overlay"></div>
            <div id="autocapture-ring"></div>
            <div id="camera-guide" class="camera-guide">Align document within frame</div>
        </div>
        <div class="camera-controls">
            <button class="btn-camera-cancel" onclick="stopCamera()">Cancel</button>
            <button id="shutter-btn" class="btn-shutter" onclick="captureManual()"></button>
            <div style="width: 50px"></div>
        </div>
    </div>

    <!-- CROP VIEW -->
    <div id="view-crop" class="card hidden">
        <div class="crop-wrapper">
            <span class="section-label" id="crop-label">Quality Check</span>
            <div class="crop-container">
                <img id="crop-image" src="">
                <canvas id="crop-canvas" class="hidden"></canvas>
            </div>

            <div class="action-stack" style="display: flex; flex-direction: column; gap: 10px;">
                <button id="btn-add-to-queue" class="btn-master" onclick="confirmCrop()">ADD TO PRINT QUEUE</button>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button id="btn-toggle-auto" class="btn-master" style="background: var(--navy-light); color: var(--gold);" onclick="useAutoCrop()">Auto Crop</button>
                    <button id="btn-manual-crop" class="btn-master" style="background: var(--navy-light); color: var(--gold);" onclick="enableManualCrop()">Manual Crop</button>
                </div>

                <button id="btn-use-original" class="btn-master" style="background: var(--navy-light); color: var(--gold);" onclick="useOriginal()">Use Original</button>
                <button class="btn-master" style="background: #444; color: white;" onclick="retakePhoto()">Discard & Retake</button>
            </div>
        </div>
    </div>

    <!-- LOADING / PROGRESS VIEW -->
    <div id="view-progress" class="card hidden">
        <div class="loader-overlay">
            <div class="spinner"></div>
            <h3 id="progress-title">Processing...</h3>
            <p id="progress-desc" style="color: #aaa; font-size: 14px; margin-top: 10px;">Please wait.</p>
        </div>
    </div>

    <!-- SUCCESS VIEW -->
    <div id="view-success" class="card hidden" style="text-align: center;">
        <div style="font-size: 50px; color: var(--gold); margin-bottom: 15px;">✓</div>
        <h2 style="color: var(--gold-light); margin-bottom: 10px;">Sent to Queue!</h2>
        <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 8px; padding: 20px; margin: 20px 0;">
            <div style="font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">Queue ID</div>
            <div id="display-queue-id" style="font-size: 24px; font-weight: bold; letter-spacing: 2px; color: var(--gold-light);">AR-XXXX</div>
            <div style="font-size: 12px; color: #888; margin-top: 8px;">Show this to the counter</div>
        </div>
        <button class="btn-master" onclick="location.reload()">Done — Print Another</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    const PRODUCTION_MODE = {{ 'true' if production_mode else 'false' }};

    // Global state
    let queue = [];
    let cropper = null;
    let cameraStream = null;
    let cvLoaded = false;
    let isDetecting = false;
    let lastDetectionTime = 0;
    let currentPreviewCanvas = null;
    let currentAutoPts = null;
    let currentWarpedCanvas = null;

    // Auto-capture state
    let stabilityTimer = 0;
    let lastBestPoints = null;
    let autoCaptureFired = false;

    const views = {
        main: document.getElementById('view-main'),
        camera: document.getElementById('view-camera'),
        crop: document.getElementById('view-crop'),
        progress: document.getElementById('view-progress'),
        success: document.getElementById('view-success')
    };

    function showView(viewName) {
        Object.keys(views).forEach(k => views[k].classList.add('hidden'));
        views[viewName].classList.remove('hidden');
    }

    // ── Toast Notifications ──────────────────────────────────────────────────
    function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3100);
    }

    // ── OpenCV Loading ───────────────────────────────────────────────────────
    function onOpenCvReady() {
        if (typeof cv === 'undefined') return;
        const bar = document.getElementById('cv-loading-bar');
        const init = () => {
            cvLoaded = true;
            bar.style.width = '100%';
            setTimeout(() => bar.style.display = 'none', 500);
        };
        if (cv.Mat) { init(); return; }
        cv['onRuntimeInitialized'] = init;
    }

    const cvScript = document.createElement('script');
    cvScript.async = true;
    cvScript.src = 'https://docs.opencv.org/4.8.0/opencv.js';
    cvScript.onload = onOpenCvReady;
    cvScript.onerror = () => showToast('Camera detection unavailable — manual capture still works', 'error');
    document.body.appendChild(cvScript);

    // ── Queue Management ─────────────────────────────────────────────────────
    function addToQueue(blob, name, type) {
        const id = Date.now() + Math.random();
        const url = URL.createObjectURL(blob);
        queue.push({ id, blob, name, type, url });
        updateQueueUI();
    }

    function removeFromQueue(id) {
        const idx = queue.findIndex(item => item.id === id);
        if (idx !== -1) {
            URL.revokeObjectURL(queue[idx].url);
            queue.splice(idx, 1);
        }
        updateQueueUI();
    }

    function updateQueueUI() {
        const grid = document.getElementById('queue-grid');
        const emptyHint = document.getElementById('queue-empty');
        const countLabel = document.getElementById('queue-count');
        const submitBtn = document.getElementById('btn-submit-all');

        grid.innerHTML = '';
        if (queue.length === 0) {
            emptyHint.classList.remove('hidden');
            submitBtn.disabled = true;
        } else {
            emptyHint.classList.add('hidden');
            submitBtn.disabled = false;
            queue.forEach(item => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                if (item.type === 'application/pdf') {
                    div.innerHTML = `<div class="pdf-icon">📄<small>${item.name}</small></div>`;
                } else {
                    div.innerHTML = `<img src="${item.url}" loading="lazy">`;
                }
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.innerHTML = '×';
                removeBtn.onclick = (e) => { e.stopPropagation(); removeFromQueue(item.id); };
                div.appendChild(removeBtn);
                grid.appendChild(div);
            });
        }
        countLabel.textContent = `${queue.length} Item${queue.length === 1 ? '' : 's'}`;
    }

    // ── Debug Logging ─────────────────────────────────────────────────────────
    function logDebug(msg, data = null) {
        if (PRODUCTION_MODE) return;
        const overlay = document.getElementById('camera-debug-overlay');
        if (!overlay) return;
        if (msg === 'CLEAR') { overlay.innerHTML = ''; return; }
        const row = document.createElement('div');
        row.className = 'debug-row';
        row.innerHTML = `<span>${msg}</span><span class="debug-val">${data !== null ? data : ''}</span>`;
        overlay.appendChild(row);
        if (overlay.children.length > 20) overlay.removeChild(overlay.firstChild);
    }

    // ── Camera ────────────────────────────────────────────────────────────────
    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            });
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('detection-overlay');
            video.srcObject = cameraStream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                isDetecting = true;
                stabilityTimer = 0;
                lastBestPoints = null;
                autoCaptureFired = false;
                showView('camera');
                requestAnimationFrame(detectionLoop);
            };
        } catch (err) {
            showToast('Camera Error: ' + err.message, 'error');
        }
    }

    function stopCamera() {
        isDetecting = false;
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        const ring = document.getElementById('autocapture-ring');
        ring.classList.remove('visible', 'flash');
        showView('main');
    }

    function detectionLoop(timestamp) {
        if (!isDetecting) return;

        const video = document.getElementById('camera-video');
        const canvas = document.getElementById('detection-overlay');
        const guide = document.getElementById('camera-guide');
        const ring = document.getElementById('autocapture-ring');

        if (!video.videoWidth || !cvLoaded) { requestAnimationFrame(detectionLoop); return; }
        if (timestamp - lastDetectionTime < 150) { requestAnimationFrame(detectionLoop); return; }
        lastDetectionTime = timestamp;

        const result = detectDocument(video);
        const best = result.bestRect;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (best) {
            const stable = checkStability(best.points);
            if (stable) {
                stabilityTimer += 150;

                if (stabilityTimer >= 1800 && !autoCaptureFired) {
                    // Auto-capture!
                    autoCaptureFired = true;
                    ring.classList.add('flash');
                    guide.textContent = 'Capturing…';
                    guide.classList.add('guide-locked');
                    setTimeout(() => triggerAutoCapture(best.points), 80);
                    return;
                } else if (stabilityTimer >= 600) {
                    const remaining = Math.ceil((1800 - stabilityTimer) / 600);
                    guide.textContent = remaining > 0 ? `Hold still… ${remaining}` : 'Capturing…';
                    guide.classList.add('guide-locked');
                    ring.classList.add('visible');
                    ring.classList.remove('flash');
                } else {
                    guide.textContent = 'Document detected — hold still';
                    guide.classList.add('guide-locked');
                    ring.classList.remove('visible');
                }
            } else {
                stabilityTimer = 0;
                guide.textContent = 'Align document within frame';
                guide.classList.remove('guide-locked');
                ring.classList.remove('visible', 'flash');
            }
            drawShape(ctx, best.points, '#27AE60', 5);
        } else {
            stabilityTimer = 0;
            guide.textContent = 'Align document within frame';
            guide.classList.remove('guide-locked');
            ring.classList.remove('visible', 'flash');
        }

        if (!PRODUCTION_MODE && result.rects.length > 0) {
            result.rects.slice(1, 4).forEach(r => drawShape(ctx, r.points, 'rgba(212,175,55,0.3)', 1));
        }

        requestAnimationFrame(detectionLoop);
    }

    function checkStability(newPts) {
        if (!lastBestPoints) { lastBestPoints = newPts; return false; }
        let totalDiff = 0;
        for (let i = 0; i < 4; i++) {
            totalDiff += Math.abs(newPts[i].x - lastBestPoints[i].x);
            totalDiff += Math.abs(newPts[i].y - lastBestPoints[i].y);
        }
        lastBestPoints = newPts;
        return totalDiff < 80; // ~10px per corner — natural handheld steadiness
    }

    function drawShape(ctx, pts, color, width) {
        if (!pts || pts.length < 2) return;
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath(); ctx.stroke();
    }

    // ── Document Detection (multi-pass) ───────────────────────────────────────
    function detectDocument(source) {
        const results = { rects: [], bestRect: null, contourCount: 0 };
        if (!cvLoaded) return results;

        try {
            const vw = source.videoWidth || source.width;
            const vh = source.videoHeight || source.height;
            const scale = 0.35;
            const tw = Math.round(vw * scale);
            const th = Math.round(vh * scale);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = tw; tempCanvas.height = th;
            tempCanvas.getContext('2d').drawImage(source, 0, 0, tw, th);

            let src = cv.imread(tempCanvas);
            let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            const allCandidates = [];

            // Pass 1: Standard Canny
            const p1 = processPass(gray, 40, 120, tw, th, scale);
            allCandidates.push(...p1);

            // Pass 2: CLAHE for low-contrast docs
            let clahe = new cv.CLAHE(3.0, new cv.Size(8, 8));
            let contrastGray = new cv.Mat();
            clahe.apply(gray, contrastGray);
            const p2 = processPass(contrastGray, 25, 80, tw, th, scale);
            allCandidates.push(...p2);
            contrastGray.delete(); clahe.delete();

            // Pass 3: Adaptive threshold
            let thresh = new cv.Mat();
            cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
            const p3 = processPass(thresh, 0, 0, tw, th, scale, true);
            allCandidates.push(...p3);
            thresh.delete();

            // Deduplicate and rank
            const deduped = deduplicateCandidates(allCandidates);
            deduped.sort((a, b) => b.score - a.score);

            results.rects = deduped;
            results.bestRect = deduped[0] || null;
            results.contourCount = allCandidates.length;

            src.delete(); gray.delete();
        } catch (e) {
            if (!PRODUCTION_MODE) console.error('[Detection]', e);
        }
        return results;
    }

    function processPass(gray, low, high, tw, th, scale, isThresh = false) {
        const candidates = [];
        const frameArea = tw * th;
        const borderMargin = Math.min(tw, th) * 0.03; // 3% border exclusion zone

        let edges = new cv.Mat();
        if (isThresh) {
            edges = gray.clone();
        } else {
            cv.GaussianBlur(gray, edges, new cv.Size(5, 5), 0);
            cv.Canny(edges, edges, low, high);
        }

        let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
        cv.dilate(edges, edges, kernel);

        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(edges, contours, hierarchy, cv.RETR_CCOMP, cv.CHAIN_APPROX_SIMPLE);

        const minArea = frameArea * 0.08; // at least 8% of frame

        for (let i = 0; i < contours.size(); i++) {
            // Only top-level contours
            if (hierarchy.intPtr(0, i)[3] !== -1) continue;

            let cnt = contours.get(i);
            let area = cv.contourArea(cnt);
            if (area < minArea) continue;

            let hull = new cv.Mat();
            cv.convexHull(cnt, hull);

            let rect = cv.minAreaRect(hull);
            const rw = rect.size.width, rh = rect.size.height;
            if (rw < 30 || rh < 30) { hull.delete(); continue; }

            const hullArea = cv.contourArea(hull);
            const rectArea = rw * rh;
            const rectangularity = hullArea / rectArea;

            // Get the 4 corner points (scaled back to video coords)
            let box = cv.RotatedRect.points({
                center: rect.center,
                size: { width: rw * 1.03, height: rh * 1.03 }, // tiny expansion
                angle: rect.angle
            });

            const pts = [];
            let touchesBorder = false;
            for (let j = 0; j < 4; j++) {
                const px = box[j].x / scale;
                const py = box[j].y / scale;
                pts.push({ x: px, y: py });
                // Reject if corners are too close to the frame edge
                if (box[j].x < borderMargin || box[j].x > tw - borderMargin ||
                    box[j].y < borderMargin || box[j].y > th - borderMargin) {
                    touchesBorder = true;
                }
            }

            if (touchesBorder) { hull.delete(); continue; }

            const ratio = Math.max(rw / rh, rh / rw);

            // Score: prefer large, rectangular, A4-proportioned shapes
            let score = (area / frameArea) * 80;
            if (ratio >= 1.3 && ratio <= 1.55) score += 40; // A4 / Letter
            if (ratio >= 1.55 && ratio <= 1.80) score += 25; // other IDs/docs
            if (rectangularity > 0.85) score += 25;
            else if (rectangularity > 0.70) score += 10;

            candidates.push({ points: orderPoints(pts), area, ratio: +ratio.toFixed(2), score, rectangularity: +rectangularity.toFixed(2) });
            hull.delete();
        }

        edges.delete(); kernel.delete(); contours.delete(); hierarchy.delete();
        return candidates;
    }

    function deduplicateCandidates(candidates) {
        // Remove candidates whose center is within 15% of another higher-scored one
        const sorted = [...candidates].sort((a, b) => b.score - a.score);
        const kept = [];
        for (const c of sorted) {
            const cx = (c.points[0].x + c.points[2].x) / 2;
            const cy = (c.points[0].y + c.points[2].y) / 2;
            const dup = kept.some(k => {
                const kx = (k.points[0].x + k.points[2].x) / 2;
                const ky = (k.points[0].y + k.points[2].y) / 2;
                return Math.hypot(cx - kx, cy - ky) < 80;
            });
            if (!dup) kept.push(c);
        }
        return kept;
    }

    function orderPoints(pts) {
        // Returns [TL, TR, BR, BL] using sum/diff method
        const sum = pts.map(p => p.x + p.y);
        const diff = pts.map(p => p.y - p.x);
        return [
            pts[sum.indexOf(Math.min(...sum))],  // TL: min x+y
            pts[diff.indexOf(Math.min(...diff))], // TR: min y-x
            pts[sum.indexOf(Math.max(...sum))],  // BR: max x+y
            pts[diff.indexOf(Math.max(...diff))] // BL: max y-x
        ];
    }

    // ── Capture ───────────────────────────────────────────────────────────────
    function captureManual() {
        if (!isDetecting) return;
        isDetecting = false; // Stop detection loop immediately
        const video = document.getElementById('camera-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const res = detectDocument(video);
        processFinalImage(canvas, res.bestRect ? res.bestRect.points : null);
    }

    function triggerAutoCapture(pts) {
        if (!isDetecting) return;
        isDetecting = false;
        if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
        const video = document.getElementById('camera-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        processFinalImage(canvas, pts);
    }

    async function processFinalImage(sourceCanvas, pts) {
        // Always destroy any lingering cropper before loading new image
        if (cropper) { cropper.destroy(); cropper = null; }

        // Stop camera tracks (if not already stopped)
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }

        currentPreviewCanvas = sourceCanvas;
        currentAutoPts = pts;
        currentWarpedCanvas = null;

        const autoBtn = document.getElementById('btn-toggle-auto');

        if (pts) {
            try {
                const warped = warpDocument(sourceCanvas, pts);
                currentWarpedCanvas = warped; // no refine — warp is enough
                updateCropPreview(currentWarpedCanvas);
                autoBtn.textContent = 'Reset to Original';
                autoBtn.onclick = useOriginal;
                document.getElementById('crop-label').textContent = 'Auto Cropped';
            } catch (e) {
                // Warp failed — fall back to original
                updateCropPreview(sourceCanvas);
                autoBtn.textContent = 'Auto Crop';
                autoBtn.onclick = useAutoCrop;
                document.getElementById('crop-label').textContent = 'Preview';
            }
        } else {
            updateCropPreview(sourceCanvas);
            autoBtn.textContent = 'Auto Crop';
            autoBtn.onclick = useAutoCrop;
            document.getElementById('crop-label').textContent = 'No document detected';
        }

        showView('crop');
    }

    // ── Perspective Warp ──────────────────────────────────────────────────────
    function warpDocument(src, pts) {
        const w1 = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const w2 = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);
        const h1 = Math.hypot(pts[3].x - pts[0].x, pts[3].y - pts[0].y);
        const h2 = Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y);
        const maxW = Math.round(Math.max(w1, w2));
        const maxH = Math.round(Math.max(h1, h2));

        let mat = cv.imread(src);
        let dst = new cv.Mat();
        let sP = cv.matFromArray(4, 1, cv.CV_32FC2, [
            pts[0].x, pts[0].y,
            pts[1].x, pts[1].y,
            pts[2].x, pts[2].y,
            pts[3].x, pts[3].y
        ]);
        let dP = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxW, 0, maxW, maxH, 0, maxH]);
        let M = cv.getPerspectiveTransform(sP, dP);
        cv.warpPerspective(mat, dst, M, new cv.Size(maxW, maxH), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

        const out = document.createElement('canvas');
        cv.imshow(out, dst);
        mat.delete(); dst.delete(); M.delete(); sP.delete(); dP.delete();
        return out;
    }

    // ── Crop View Actions ─────────────────────────────────────────────────────
    function updateCropPreview(canvas) {
        const cropImg = document.getElementById('crop-image');
        const cc = document.getElementById('crop-canvas');
        // Update hidden canvas first (this is what confirmCrop reads)
        cc.width = canvas.width; cc.height = canvas.height;
        cc.getContext('2d').drawImage(canvas, 0, 0);
        // Update visible img
        cropImg.src = canvas.toDataURL('image/jpeg', 0.92);
    }

    function useAutoCrop() {
        if (!currentAutoPts) {
            const res = detectDocument(currentPreviewCanvas);
            if (res.bestRect) currentAutoPts = res.bestRect.points;
        }
        if (!currentAutoPts) { showToast('Could not detect document edges — try Manual Crop', 'error'); return; }
        try {
            currentWarpedCanvas = warpDocument(currentPreviewCanvas, currentAutoPts);
            updateCropPreview(currentWarpedCanvas);
            const btn = document.getElementById('btn-toggle-auto');
            btn.textContent = 'Reset to Original'; btn.onclick = useOriginal;
            document.getElementById('crop-label').textContent = 'Auto Cropped';
        } catch (e) {
            showToast('Auto crop failed — use Manual Crop', 'error');
        }
    }

    function useOriginal() {
        if (cropper) { cropper.destroy(); cropper = null; }
        currentWarpedCanvas = null;
        updateCropPreview(currentPreviewCanvas);
        const btn = document.getElementById('btn-toggle-auto');
        btn.textContent = 'Auto Crop'; btn.onclick = useAutoCrop;
        document.getElementById('crop-label').textContent = 'Original Image';
    }

    function enableManualCrop() {
        // Show original (non-warped) for the cropper so user crops on full frame
        if (cropper) { cropper.destroy(); cropper = null; }
        updateCropPreview(currentPreviewCanvas);
        document.getElementById('crop-label').textContent = 'Drag to adjust crop';
        const cropImg = document.getElementById('crop-image');
        cropper = new Cropper(cropImg, {
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.95,
            restore: false,
            guides: true,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true
        });
    }

    function confirmCrop() {
        let finalCanvas;
        if (cropper) {
            finalCanvas = cropper.getCroppedCanvas({ maxWidth: 2048, maxHeight: 2048 });
            cropper.destroy(); cropper = null;
        } else {
            finalCanvas = document.getElementById('crop-canvas');
        }
        finalCanvas.toBlob(blob => {
            addToQueue(blob, `scan_${Date.now()}.jpg`, 'image/jpeg');
            showToast('Added to print queue', 'success');
            showView('main');
        }, 'image/jpeg', 0.92);
    }

    function retakePhoto() {
        if (cropper) { cropper.destroy(); cropper = null; }
        currentPreviewCanvas = null; currentAutoPts = null; currentWarpedCanvas = null;
        startCamera();
    }

    // ── File Upload (multi-file, no crop UI) ──────────────────────────────────
    function triggerFileInput() { document.getElementById('file-input').click(); }

    function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        e.target.value = ''; // reset so same file can be selected again
        if (!files.length) return;

        const MAX_SIZE = 50 * 1024 * 1024;
        const oversized = files.filter(f => f.size > MAX_SIZE);
        if (oversized.length) {
            showToast(`${oversized.length} file(s) exceed 50 MB and were skipped`, 'error');
        }

        const valid = files.filter(f => f.size <= MAX_SIZE);
        valid.forEach(f => {
            const type = f.type || (f.name.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
            addToQueue(f, f.name, type);
        });

        if (valid.length) {
            showToast(`${valid.length} file${valid.length > 1 ? 's' : ''} added to queue`, 'success');
        }
    }

    // ── Submit ────────────────────────────────────────────────────────────────
    function submitAll() {
        if (!queue.length) return;

        const totalSize = queue.reduce((sum, item) => sum + (item.blob.size || 0), 0);
        if (totalSize > 50 * 1024 * 1024) {
            showToast('Total file size exceeds 50 MB. Please remove some items.', 'error');
            return;
        }

        showView('progress');
        document.getElementById('progress-title').textContent = `Sending ${queue.length} item${queue.length > 1 ? 's' : ''}…`;
        document.getElementById('progress-desc').textContent = 'Please wait while your documents are uploaded.';

        const fd = new FormData();
        queue.forEach((item, i) => fd.append('files[]', item.blob, item.name || `doc_${i}.jpg`));
        fd.append('print_mode', document.querySelector('input[name="print-mode"]:checked').value);
        fd.append('copies', document.getElementById('copies-select').value);

        fetch('/upload', { method: 'POST', body: fd })
            .then(r => {
                if (!r.ok) return r.json().then(d => Promise.reject(d.error || `Server error ${r.status}`));
                return r.json();
            })
            .then(data => {
                document.getElementById('display-queue-id').textContent = data.queue_id;
                queue.forEach(item => URL.revokeObjectURL(item.url));
                queue = [];
                updateQueueUI();
                showView('success');
            })
            .catch(err => {
                showToast('Upload failed: ' + err, 'error');
                showView('main');
            });
    }
</script>
