<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aradhana Jewellers | Smart Scan & Print</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        :root {
            --navy: #06142E;
            --navy-light: #112244;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --bg-color: #F7F5F0;
            --text-light: #FFFFFF;
            --error: #E74C3C;
            --success: #27AE60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-action {
            background: var(--navy-light);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 20px 10px;
            color: var(--gold-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 100px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-action:active {
            transform: scale(0.95);
            background: rgba(212, 175, 55, 0.1);
        }

        .btn-action span { font-size: 32px; }
        .btn-action strong { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        .header { text-align: center; margin: 10px 0; }
        .header h1 { color: var(--navy); font-family: Georgia, serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: var(--navy);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(6, 20, 46, 0.2);
            color: white;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Debug UI (Hidden in Production) */
        .debug-overlay {
            display: {% if production_mode %}none{% else %}block{% endif %};
            position: absolute;
            top: 60px; left: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 10px;
            border-radius: 8px;
            z-index: 110;
            pointer-events: none;
            max-width: 250px;
            line-height: 1.4;
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .debug-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(0, 255, 0, 0.1); padding: 2px 0; }
        .debug-val { color: #fff; font-weight: bold; }
        .debug-reject { color: #ff4d4d; }

        /* Queue UI */
        .queue-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 120px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .queue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }

        .queue-item {
            position: relative;
            aspect-ratio: 3/4;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .queue-item img { width: 100%; height: 100%; object-fit: contain; }

        .queue-item .pdf-icon {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--gold);
        }

        .btn-remove {
            position: absolute;
            top: 2px; right: 2px;
            background: var(--error);
            color: white;
            border: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            font-size: 14px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5;
        }

        /* Camera View & Overlays */
        .camera-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1000;
            display: flex; flex-direction: column;
        }

        .camera-container { position: relative; flex: 1; overflow: hidden; }

        #camera-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        #detection-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            z-index: 100;
            pointer-events: none;
        }

        .camera-guide {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            white-space: nowrap;
        }

        .camera-controls {
            height: 120px;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .btn-shutter {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 5px solid white;
            background: transparent;
            position: relative;
        }

        .btn-shutter::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            background: white;
            border-radius: 50%;
        }

        .btn-camera-cancel { color: white; background: transparent; border: none; font-size: 16px; }

        /* Crop View */
        .crop-wrapper { display: flex; flex-direction: column; gap: 15px; }

        .crop-container {
            width: 100%;
            height: auto;
            max-height: 60vh;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 10px;
        }

        #crop-image { 
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            display: block;
        }

        /* Print Options */
        .section-label { font-size: 12px; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; display: block; }

        .print-types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

        .type-card input { display: none; }
        .type-content {
            background: var(--navy-light);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .type-card input:checked + .type-content { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); }

        .btn-master {
            background: linear-gradient(135deg, #D4AF37 0%, #C5A059 100%);
            color: var(--navy);
            border: 0;
            border-radius: 12px;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }

        .btn-master:disabled { background: #444; color: #777; box-shadow: none; }

        .loader-overlay { text-align: center; padding: 40px 0; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.1);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #cv-loading-bar {
            position: fixed;
            bottom: 0; left: 0; width: 0%;
            background: var(--gold);
            height: 3px;
            z-index: 2000;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div id="cv-loading-bar"></div>

<div class="header">
    <h1>Aradhana</h1>
</div>

<div class="container">
    
    <!-- MAIN VIEW -->
    <div id="view-main" class="card">
        <div class="action-buttons">
            <div class="btn-action" onclick="startCamera()">
                <span>📷</span>
                <strong>Scan Document</strong>
            </div>
            <div class="btn-action" onclick="triggerFileInput()">
                <span>📁</span>
                <strong>Upload Files</strong>
            </div>
            <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.pdf" class="hidden" onchange="handleFileSelect(event)">
        </div>

        <div class="queue-container">
            <div class="queue-header">
                <span>Print Queue</span>
                <span id="queue-count">0 Items</span>
            </div>
            <div id="queue-grid" class="queue-grid"></div>
            <div id="queue-empty" style="text-align: center; color: #888; padding: 20px;">
                No documents added yet.
            </div>
        </div>

        <div class="options">
            <span class="section-label">Print Mode</span>
            <div class="print-types">
                <label class="type-card">
                    <input type="radio" name="print-mode" value="pdf">
                    <div class="type-content"><strong>Full Page</strong></div>
                </label>
                <label class="type-card">
                    <input type="radio" name="print-mode" value="id_card" checked>
                    <div class="type-content"><strong>ID Cards</strong></div>
                </label>
            </div>

            <span class="section-label">Copies</span>
            <select id="copies-select" style="width:100%; padding: 12px; border-radius: 8px; margin-bottom: 20px; background: var(--navy-light); color: white; border: 1px solid var(--gold);">
                <option value="1">1 Copy</option>
                <option value="2">2 Copies</option>
                <option value="3">3 Copies</option>
                <option value="4">4 Copies</option>
                <option value="5">5 Copies</option>
            </select>
        </div>

        <button id="btn-submit-all" class="btn-master" onclick="submitAll()" disabled>
            Send All For Printing
        </button>
    </div>

    <!-- CAMERA VIEW -->
    <div id="view-camera" class="camera-wrapper hidden">
        <div class="camera-container">
            <video id="camera-video" autoplay playsinline muted></video>
            <canvas id="detection-overlay"></canvas>
            <div id="camera-debug-overlay" class="debug-overlay"></div>
            <div id="camera-guide" class="camera-guide">Align document within frame</div>
        </div>
        <div class="camera-controls">
            <button class="btn-camera-cancel" onclick="stopCamera()">Cancel</button>
            <button id="shutter-btn" class="btn-shutter" onclick="captureManual()"></button>
            <div style="width: 50px"></div>
        </div>
    </div>

    <!-- CROP VIEW -->
    <div id="view-crop" class="card hidden">
        <div class="crop-wrapper">
            <span class="section-label" id="crop-label">Quality Check</span>
            <div class="crop-container">
                <img id="crop-image" src="">
                <canvas id="crop-canvas" class="hidden"></canvas>
            </div>
            
            <div class="action-stack" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- 1. ADD TO PRINT QUEUE (Primary) -->
                <button id="btn-add-to-queue" class="btn-master" onclick="confirmCrop()">ADD TO PRINT QUEUE</button>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <!-- 2. Reset / Auto Crop Toggle -->
                    <button id="btn-toggle-auto" class="btn-master" style="background: var(--navy-light); color: var(--gold);" onclick="useAutoCrop()">Auto Crop</button>
                    <!-- 3. Manual Crop -->
                    <button id="btn-manual-crop" class="btn-master" style="background: var(--navy-light); color: var(--gold);" onclick="enableManualCrop()">Manual Crop</button>
                </div>
                
                <!-- 4. Use Original -->
                <button id="btn-use-original" class="btn-master" style="background: var(--navy-light); color: var(--gold);" onclick="useOriginal()">Use Original</button>
                
                <!-- 5. Discard -->
                <button class="btn-master" style="background: #444; color: white;" onclick="retakePhoto()">Discard</button>
            </div>
        </div>
    </div>

    <!-- LOADING / PROGRESS VIEW -->
    <div id="view-progress" class="card hidden">
        <div class="loader-overlay">
            <div class="spinner"></div>
            <h3 id="progress-title">Processing...</h3>
            <p id="progress-desc" style="color: #aaa; font-size: 14px; margin-top: 10px;">Please wait.</p>
        </div>
    </div>

    <!-- SUCCESS VIEW -->
    <div id="view-success" class="card hidden" style="text-align: center;">
        <div style="font-size: 50px; color: var(--gold); margin-bottom: 15px;">✓</div>
        <h2 style="color: var(--gold-light); margin-bottom: 10px;">Sent to Queue!</h2>
        <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--gold); border-radius: 8px; padding: 20px; margin: 20px 0;">
            <div style="font-size: 12px; color: #aaa; text-transform: uppercase;">Queue ID</div>
            <div id="display-queue-id" style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">AR-XXXX</div>
        </div>
        <button class="btn-master" onclick="location.reload()">Done</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    // Global State
    const PRODUCTION_MODE = {{ 'true' if production_mode else 'false' }};
    let queue = [];
    let cropper = null;
    let cameraStream = null;
    let cvLoaded = false;
    let isDetecting = false;
    let lastDetectionTime = 0;
    let heartbeat = 0;
    let currentPreviewCanvas = null;
    let currentAutoPts = null;
    let currentWarpedCanvas = null;

    // Auto-capture State
    let stabilityTimer = 0;
    let autoCaptureCounter = 3;
    let lastBestPoints = null;

    const views = {
        main: document.getElementById('view-main'),
        camera: document.getElementById('view-camera'),
        crop: document.getElementById('view-crop'),
        progress: document.getElementById('view-progress'),
        success: document.getElementById('view-success')
    };

    function showView(viewName) {
        Object.keys(views).forEach(k => views[k].classList.add('hidden'));
        views[viewName].classList.remove('hidden');
    }

    // OpenCV.js Loading
    function onOpenCvReady() {
        if (typeof cv !== 'undefined') {
            cv['onRuntimeInitialized'] = () => {
                cvLoaded = true;
                logDebug("OpenCV Engine Ready");
                document.getElementById('cv-loading-bar').style.width = '100%';
                setTimeout(() => document.getElementById('cv-loading-bar').style.display = 'none', 500);
            };
            if (cv.Mat) {
                cvLoaded = true;
                document.getElementById('cv-loading-bar').style.display = 'none';
            }
        }
    }

    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://docs.opencv.org/4.8.0/opencv.js';
    script.onload = onOpenCvReady;
    document.body.appendChild(script);

    // Queue Management
    function addToQueue(blob, name, type) {
        const id = Date.now();
        const url = URL.createObjectURL(blob);
        queue.push({ id, blob, name, type, url });
        updateQueueUI();
    }

    function removeFromQueue(id) {
        const idx = queue.findIndex(item => item.id === id);
        if (idx !== -1) {
            URL.revokeObjectURL(queue[idx].url);
            queue.splice(idx, 1);
        }
        updateQueueUI();
    }

    function updateQueueUI() {
        const grid = document.getElementById('queue-grid');
        const emptyHint = document.getElementById('queue-empty');
        const countLabel = document.getElementById('queue-count');
        const submitBtn = document.getElementById('btn-submit-all');

        grid.innerHTML = '';
        if (queue.length === 0) {
            emptyHint.classList.remove('hidden');
            submitBtn.disabled = true;
        } else {
            emptyHint.classList.add('hidden');
            submitBtn.disabled = false;
            queue.forEach(item => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.innerHTML = item.type === 'application/pdf' ? `<div class="pdf-icon">PDF</div>` : `<img src="${item.url}">`;
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.innerHTML = '×';
                removeBtn.onclick = (e) => { e.stopPropagation(); removeFromQueue(item.id); };
                div.appendChild(removeBtn);
                grid.appendChild(div);
            });
        }
        countLabel.textContent = `${queue.length} Item${queue.length === 1 ? '' : 's'}`;
    }

    function logDebug(msg, data = null) {
        if (PRODUCTION_MODE) {
            console.log(`[DEBUG] ${msg}`, data);
            return;
        }
        const overlay = document.getElementById('camera-debug-overlay');
        if (!overlay) return;
        if (msg === "CLEAR") { overlay.innerHTML = ''; return; }
        const row = document.createElement('div');
        row.className = 'debug-row';
        row.innerHTML = `<span>${msg}</span><span class="debug-val">${data !== null ? data : ''}</span>`;
        overlay.appendChild(row);
        if (overlay.children.length > 20) overlay.removeChild(overlay.firstChild);
    }

    // Camera Logic
    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            });
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('detection-overlay');
            video.srcObject = cameraStream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                showView('camera');
                isDetecting = true;
                stabilityTimer = 0;
                autoCaptureCounter = 3;
                lastBestPoints = null;
                requestAnimationFrame(detectionLoop);
            };
        } catch (err) { alert("Camera Error: " + err.message); }
    }

    function stopCamera() {
        isDetecting = false;
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        showView('main');
    }

    function detectionLoop(timestamp) {
        if (!isDetecting) return;
        heartbeat++;
        const video = document.getElementById('camera-video');
        const canvas = document.getElementById('detection-overlay');
        const guide = document.getElementById('camera-guide');

        if (!video.videoWidth || !cvLoaded) { requestAnimationFrame(detectionLoop); return; }
        if (timestamp - lastDetectionTime < 200) { requestAnimationFrame(detectionLoop); return; }
        lastDetectionTime = timestamp;

        const result = detectDocument(video);
        const best = result.bestRect;

        // Visuals & Auto-Capture Logic
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (best) {
            const stable = checkStability(best.points);
            if (stable) {
                stabilityTimer += 200;
                if (stabilityTimer >= 800) {
                    autoCaptureCounter = 3 - Math.floor((stabilityTimer - 800) / 800);
                    if (autoCaptureCounter <= 0) {
                        guide.textContent = "Capturing...";
                        triggerAutoCapture(best.points);
                        return;
                    }
                    guide.textContent = `Hold Still... Capturing in ${autoCaptureCounter}`;
                } else {
                    guide.textContent = "Hold Still";
                }
            } else {
                stabilityTimer = 0;
                autoCaptureCounter = 3;
                guide.textContent = "Document found";
            }
            drawShape(ctx, best.points, '#27AE60', 6);
        } else {
            stabilityTimer = 0;
            autoCaptureCounter = 3;
            guide.textContent = "Align document within frame";
        }

        // Draw alternate candidates (Only in non-production)
        if (!PRODUCTION_MODE) {
            result.rects.forEach(r => { if (r !== best) drawShape(ctx, r.points, 'rgba(212,175,55,0.4)', 2); });
        }

        requestAnimationFrame(detectionLoop);
    }

    function checkStability(newPoints) {
        if (!lastBestPoints) { lastBestPoints = newPoints; return false; }
        const threshold = 30; // pixels
        let diff = 0;
        for (let i = 0; i < 4; i++) {
            diff += Math.abs(newPoints[i].x - lastBestPoints[i].x);
            diff += Math.abs(newPoints[i].y - lastBestPoints[i].y);
        }
        lastBestPoints = newPoints;
        return diff < threshold;
    }

    function drawShape(ctx, pts, color, width) {
        if (pts.length < 2) return;
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath(); ctx.stroke();
    }

    // Advanced Detection Core (Multi-pass)
    function detectDocument(source) {
        const results = { rects: [], bestRect: null, contourCount: 0, rejectionReason: "No doc found", rejectedContours: [] };
        try {
            const vw = source.videoWidth || source.width;
            const vh = source.videoHeight || source.height;
            const scale = 0.3;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = vw * scale; tempCanvas.height = vh * scale;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(source, 0, 0, tempCanvas.width, tempCanvas.height);

            let src = cv.imread(tempCanvas);
            let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            const allCandidates = [];

            // Pass 1: Standard
            const pass1 = processPass(gray, 50, 150, tempCanvas.width, tempCanvas.height, scale);
            allCandidates.push(...pass1.candidates);
            results.contourCount += pass1.contourCount;

            // Pass 2: CLAHE for Low Contrast
            let clahe = new cv.CLAHE(2.0, new cv.Size(8, 8));
            let contrastGray = new cv.Mat();
            clahe.apply(gray, contrastGray);
            const pass2 = processPass(contrastGray, 30, 100, tempCanvas.width, tempCanvas.height, scale);
            allCandidates.push(...pass2.candidates);
            results.contourCount += pass2.contourCount;
            contrastGray.delete(); clahe.delete();

            // Pass 3: Adaptive Threshold
            let thresh = new cv.Mat();
            cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
            const pass3 = processPass(thresh, 0, 0, tempCanvas.width, tempCanvas.height, scale, true);
            allCandidates.push(...pass3.candidates);
            results.contourCount += pass3.contourCount;
            thresh.delete();

            if (allCandidates.length > 0) {
                allCandidates.sort((a, b) => b.score - a.score);
                results.bestRect = allCandidates[0];
                results.rects = allCandidates;
                results.rejectionReason = "None";
            }

            src.delete(); gray.delete();
        } catch (e) { console.error(e); }
        return results;
    }

    function processPass(gray, low, high, tw, th, scale, isThreshold = false) {
        let edges = new cv.Mat();
        if (isThreshold) {
            edges = gray.clone();
        } else {
            cv.GaussianBlur(gray, edges, new cv.Size(5, 5), 0);
            cv.Canny(edges, edges, low, high);
        }
        
        let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
        cv.dilate(edges, edges, kernel);

        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(edges, contours, hierarchy, cv.RETR_CCOMP, cv.CHAIN_APPROX_SIMPLE);

        const candidates = [];
        const frameArea = tw * th;
        const minArea = frameArea * 0.05;

        for (let i = 0; i < contours.size(); ++i) {
            const parent = hierarchy.intPtr(0, i)[3];
            if (parent !== -1) continue;

            let cnt = contours.get(i);
            let area = cv.contourArea(cnt);
            if (area < minArea / 2) continue;

            let hull = new cv.Mat();
            cv.convexHull(cnt, hull);
            let rect = cv.minAreaRect(hull);
            const w = rect.size.width;
            const h = rect.size.height;
            if (w < 20 || h < 20) { hull.delete(); continue; }

            const ratio = Math.max(w/h, h/w);
            const rectArea = w * h;
            const rectangularity = area / rectArea;

            let score = (area / frameArea) * 100;
            if (ratio >= 1.45 && ratio <= 1.75) score += 50;
            if (rectangularity > 0.8) score += 20;

            const dummyRect = {
                center: rect.center,
                size: { width: rect.size.width * 1.05, height: rect.size.height * 1.05 },
                angle: rect.angle
            };
            
            let box = cv.RotatedRect.points(dummyRect);
            const pts = [];
            for (let j = 0; j < 4; j++) {
                pts.push({ 
                    x: Math.max(0, Math.min(tw, box[j].x)) / scale, 
                    y: Math.max(0, Math.min(th, box[j].y)) / scale 
                });
            }

            candidates.push({ 
                points: orderPoints(pts), 
                area, ratio: ratio.toFixed(2), score, rectangularity: rectangularity.toFixed(2)
            });
            hull.delete();
        }
        edges.delete(); kernel.delete(); contours.delete(); hierarchy.delete();
        return { candidates, contourCount: contours.size() };
    }

    function orderPoints(pts) {
        const sum = pts.map(p => p.x + p.y); const diff = pts.map(p => p.y - p.x);
        return [pts[sum.indexOf(Math.min(...sum))], pts[diff.indexOf(Math.min(...diff))], pts[sum.indexOf(Math.max(...sum))], pts[diff.indexOf(Math.max(...diff))]];
    }

    function captureManual() {
        if (!isDetecting) return;
        const video = document.getElementById('camera-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const res = detectDocument(video);
        processFinalImage(canvas, res.bestRect ? res.bestRect.points : null);
    }

    function triggerAutoCapture(pts) {
        if (!isDetecting) return;
        const video = document.getElementById('camera-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        if (navigator.vibrate) navigator.vibrate(100);
        processFinalImage(canvas, pts);
    }

    async function processFinalImage(sourceCanvas, pts) {
        stopCamera();
        currentPreviewCanvas = sourceCanvas; currentAutoPts = pts;
        let finalCanvas = sourceCanvas;
        if (pts) {
            const warped = warpDocument(sourceCanvas, pts);
            finalCanvas = refineDocument(warped);
        }
        currentWarpedCanvas = finalCanvas;
        updateCropPreview(finalCanvas);
        const autoBtn = document.getElementById('btn-toggle-auto');
        if (pts) {
            autoBtn.textContent = "Reset to Original"; autoBtn.onclick = useOriginal;
            document.getElementById('crop-label').textContent = "Auto Processed";
        } else {
            autoBtn.textContent = "Auto Crop"; autoBtn.onclick = useAutoCrop;
            document.getElementById('crop-label').textContent = "No doc detected";
        }
        showView('crop');
    }

    function warpDocument(src, pts) {
        let mat = cv.imread(src);
        const w1 = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const w2 = Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y);
        const maxWidth = Math.max(w1, w2);
        const h1 = Math.hypot(pts[3].x - pts[0].x, pts[3].y - pts[0].y);
        const h2 = Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y);
        const maxHeight = Math.max(h1, h2);
        let dst = new cv.Mat();
        let sP = cv.matFromArray(4, 1, cv.CV_32FC2, [pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y]);
        let dP = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight]);
        let M = cv.getPerspectiveTransform(sP, dP);
        cv.warpPerspective(mat, dst, M, new cv.Size(maxWidth, maxHeight), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
        const out = document.createElement('canvas'); cv.imshow(out, dst);
        mat.delete(); dst.delete(); M.delete(); sP.delete(); dP.delete();
        return out;
    }

    function refineDocument(canvas) {
        try {
            let src = cv.imread(canvas); let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.threshold(gray, gray, 50, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
            let contours = new cv.MatVector(); let hierarchy = new cv.Mat();
            cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            let maxArea = 0, bestRect = null;
            for(let i=0; i<contours.size(); i++) {
                let rect = cv.boundingRect(contours.get(i));
                let area = rect.width * rect.height;
                if(area > maxArea) { maxArea = area; bestRect = rect; }
            }
            if(bestRect && maxArea > (canvas.width * canvas.height * 0.5)) {
                const padW = Math.round(bestRect.width * 0.02), padH = Math.round(bestRect.height * 0.02);
                let x = Math.max(0, bestRect.x - padW), y = Math.max(0, bestRect.y - padH);
                let w = Math.min(canvas.width - x, bestRect.width + padW*2), h = Math.min(canvas.height - y, bestRect.height + padH*2);
                let roi = src.roi(new cv.Rect(x, y, w, h));
                const out = document.createElement('canvas'); cv.imshow(out, roi);
                roi.delete(); src.delete(); gray.delete(); contours.delete(); hierarchy.delete(); return out;
            }
            src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
        } catch(e) {}
        return canvas;
    }

    function updateCropPreview(canvas) {
        const cropImg = document.getElementById('crop-image');
        cropImg.src = canvas.toDataURL('image/jpeg', 0.9);
        const cc = document.getElementById('crop-canvas');
        cc.width = canvas.width; cc.height = canvas.height;
        cc.getContext('2d').drawImage(canvas, 0, 0);
    }

    function useAutoCrop() {
        if (!currentAutoPts) {
            const res = detectDocument(currentPreviewCanvas);
            if (res.bestRect) currentAutoPts = res.bestRect.points;
        }
        if (currentAutoPts) {
            const warped = warpDocument(currentPreviewCanvas, currentAutoPts);
            currentWarpedCanvas = refineDocument(warped);
            updateCropPreview(currentWarpedCanvas);
            const btn = document.getElementById('btn-toggle-auto');
            btn.textContent = "Reset to Original"; btn.onclick = useOriginal;
            document.getElementById('crop-label').textContent = "Auto Processed";
        }
    }

    function useOriginal() {
        updateCropPreview(currentPreviewCanvas); currentWarpedCanvas = null;
        const btn = document.getElementById('btn-toggle-auto');
        btn.textContent = "Auto Crop"; btn.onclick = useAutoCrop;
        document.getElementById('crop-label').textContent = "Original Image";
        if (cropper) { cropper.destroy(); cropper = null; }
    }

    function enableManualCrop() {
        if (currentWarpedCanvas) useOriginal();
        document.getElementById('crop-label').textContent = "Adjust Corners";
        const cropImg = document.getElementById('crop-image');
        cropper = new Cropper(cropImg, { viewMode: 1, dragMode: 'move', autoCropArea: 0.98, restore: false, guides: true, center: true, highlight: false, cropBoxMovable: true, cropBoxResizable: true });
    }

    function confirmCrop() {
        let finalCanvas = cropper ? cropper.getCroppedCanvas({ maxWidth: 2048, maxHeight: 2048 }) : document.getElementById('crop-canvas');
        finalCanvas.toBlob(blob => {
            addToQueue(blob, `scan_${Date.now()}.jpg`, 'image/jpeg');
            showView('main');
        }, 'image/jpeg', 0.9);
    }

    function retakePhoto() { showView('main'); }

    async function processFiles(files) {
        for (const file of files) {
            if (file.type === 'application/pdf') { addToQueue(file, file.name, file.type); }
            else {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    const res = detectDocument(canvas);
                    processFinalImage(canvas, res.bestRect ? res.bestRect.points : null);
                };
                img.src = URL.createObjectURL(file);
                return;
            }
        }
    }

    function triggerFileInput() { document.getElementById('file-input').click(); }
    function handleFileSelect(e) { const files = Array.from(e.target.files); if (files.length) processFiles(files); e.target.value = ''; }

    function submitAll() {
        if (!queue.length) return;
        showView('progress');
        const fd = new FormData();
        queue.forEach((item, i) => fd.append('files[]', item.blob, item.name || `doc_${i}.jpg`));
        fd.append('print_mode', document.querySelector('input[name="print-mode"]:checked').value);
        fd.append('copies', document.getElementById('copies-select').value);
        fetch('/upload', { method: 'POST', body: fd })
        .then(r => r.json()).then(data => {
            document.getElementById('display-queue-id').textContent = data.queue_id;
            showView('success');
            queue = []; updateQueueUI();
        }).catch(err => { alert("Error: " + err.message); showView('main'); });
    }
</script>
