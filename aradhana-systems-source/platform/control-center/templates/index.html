<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIS Control Center</title><style>
:root{--ink:#10203d;--navy:#173f7a;--gold:#f2c94c;--bg:#f4f7fb;--good:#147a51;--bad:#b42318;--muted:#62718a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:22px max(20px,calc((100vw - 1100px)/2));display:flex;gap:16px;align-items:center;justify-content:space-between}h1{margin:0;font-size:clamp(22px,4vw,32px)}header p{margin:4px 0 0;color:#d9e5fa;font-size:13px}.badge{background:var(--gold);color:#17243a;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.muted{color:var(--muted);font-size:13px}button{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card{background:#fff;border:1px solid #e4eaf3;border-radius:14px;padding:17px;box-shadow:0 2px 8px #10203d0b}.service{font-size:16px;font-weight:800}.meta{margin-top:8px;color:var(--muted);font-size:12px}.state{display:inline-block;margin-top:13px;border-radius:999px;padding:5px 9px;background:#edf2f7;font-weight:800;font-size:11px;text-transform:uppercase}.healthy{background:#e7f6ef;color:var(--good)}.unreachable{background:#fcebea;color:var(--bad)}.remote_declared{background:#eef2ff;color:#3d4ea6}h2{font-size:17px;margin:28px 0 12px}.project{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0f5;padding:12px 0}.project:last-child{border:0}@media(max-width:560px){header{align-items:flex-start;flex-direction:column}.project{flex-direction:column;gap:4px}}
</style></head><body><header><div><h1>Aradhana Information Systems</h1><p>Private LAN control center · Powered by AMBIC DIGITAL</p></div><span class="badge">LOCAL ONLY</span></header><main class="wrap"><div class="toolbar"><div><strong id="device">Loading…</strong><div class="muted" id="generated"></div></div><button id="refresh">Refresh status</button></div><h2>Services</h2><section id="services" class="grid"></section><h2>Projects</h2><section id="projects" class="card"></section></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const [status,inventory]=await Promise.all([fetch('/api/v1/status').then(r=>r.json()),fetch('/api/v1/registry').then(r=>r.json())]);document.querySelector('#device').textContent=`${status.device_id} · ${status.hostname}`;document.querySelector('#generated').textContent=`Last checked: ${new Date(status.generated_at).toLocaleString()}`;document.querySelector('#services').innerHTML=status.services.map(s=>`<article class="card"><div class="service">${esc(s.id)}</div><div class="meta">${esc(s.host)} · port ${esc(s.port)} · ${esc(s.scope)}</div><span class="state ${esc(s.state)}">${esc(s.state)}</span>${s.detail?`<div class="meta">${esc(s.detail)}</div>`:''}</article>`).join('');document.querySelector('#projects').innerHTML=inventory.registry.projects.map(p=>`<div class="project"><div><strong>${esc(p.display_name)}</strong><div class="meta">${esc(p.role)}</div></div><div class="meta">${esc(p.id)}<br>${esc(p.owner_device)}</div></div>`).join('')}
document.querySelector('#refresh').onclick=()=>load().catch(e=>alert(`Could not load AIS status: ${e.message}`));load().catch(e=>alert(`Could not load AIS status: ${e.message}`));
</script></body></html>
