name: release

# Cut a release:  git tag v1.2.3 && git push --tags
# Produces a tested, signed GitHub Release: the release APK, server+web images on GHCR, and a
# minisign-signed manifest the fleet updater consumes. Requires repo secrets (see RELEASING.md):
# MDM_RELEASE_STORE_B64, MDM_RELEASE_STORE_PASSWORD, MDM_RELEASE_KEY_ALIAS, MDM_RELEASE_KEY_PASSWORD,
# MINISIGN_SECRET_KEY, MINISIGN_PASSWORD, MDM_GOOGLE_SERVICES_B64.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate the tag as strict semver FIRST — the tag name is attacker-influencable input, and
      # this guarantees VERSION is [0-9.] only before it ever reaches a shell/gradle/docker arg.
      - name: Derive + validate versions
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vMAJOR.MINOR.PATCH (got '$REF_NAME')"; exit 1; }
          {
            echo "version=$V"
            echo "code=$(release/version.sh "$V")"
            echo "proto=$(grep -oP 'PROTOCOL_VERSION[^\"]*\"\K[^\"]+' agent-android/proto/src/main/kotlin/com/mdmesh/proto/ProtocolJson.kt)"
          } >> "$GITHUB_OUTPUT"

      # --- Build + sign the release APK (gated by unit tests + R8 lintVital) ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Google has stopped serving the legacy standalone 'tools' package (only
          # platform-tools/cmdline-tools/build-tools remain), which the action installs by
          # default and which Gradle-based builds never needed anyway. Override the packages
          # list to skip it — see android-actions/setup-android#537.
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Decode release keystore
        env:
          STORE_B64: ${{ secrets.MDM_RELEASE_STORE_B64 }}
        run: printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.MDM_GOOGLE_SERVICES_B64 }}
        run: printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > agent-android/app/google-services.json
      - name: Test + assemble signed release
        working-directory: agent-android
        env:
          MDM_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          MDM_RELEASE_STORE_PASSWORD: ${{ secrets.MDM_RELEASE_STORE_PASSWORD }}
          MDM_RELEASE_KEY_ALIAS: ${{ secrets.MDM_RELEASE_KEY_ALIAS }}
          MDM_RELEASE_KEY_PASSWORD: ${{ secrets.MDM_RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          gradle --no-daemon :proto:test :core:test :app:assembleGmsRelease :app:assembleAospRelease \
            -PmdmBaseUrl=https://mdm.ambicdigital.in/ \
            -PversionName="$VERSION" -PversionCode="$CODE"
      - name: Stage APK + compute checksum
        run: |
          cp agent-android/app/build/outputs/apk/gms/release/app-gms-release.apk mdmesh-agent.apk
          CK=$(release/apk-checksum.sh mdmesh-agent.apk)
          [ -n "$CK" ] || { echo "APK signature checksum came out empty — aborting the release"; exit 1; }
          echo "CK=$CK" >> "$GITHUB_ENV"
      - name: Stage China / AOSP agent APK
        run: |
          cp agent-android/app/build/outputs/apk/aosp/release/app-aosp-release.apk ambic-mdm-agent-cn.apk

      # RELEASING.md: "NEVER ROTATE" the release keystore — every enrolled device is a Device
      # Owner install, and Android only allows a silent self-update when the new APK's signing
      # cert matches the currently-installed one. A changed keystore (accidental rotation, a
      # restored stale secret, anything) builds and signs fine but silently breaks every fleet
      # device's upgrade path, recoverable only by a physical factory reset per device. Catch
      # that here, loudly, before the mismatched APK ever gets published.
      - name: Verify signing cert hasn't drifted from prior releases
        run: |
          EXPECTED=$(cat release/expected-signing-checksum.txt)
          if [ "$CK" != "$EXPECTED" ]; then
            echo "::error::Release keystore signature checksum changed ($EXPECTED -> $CK)."
            echo "::error::This would break silent self-update on every enrolled device (factory reset required to recover)."
            echo "::error::If this is a deliberate, intentional keystore change, update release/expected-signing-checksum.txt in the same PR and document why in RELEASING.md."
            exit 1
          fi

      # --- Build + push images to GHCR ---
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')   # GHCR repo names must be lowercase
          IMG="ghcr.io/${O}/mdmesh-server"
          docker build -f docker/server.Dockerfile -t "$IMG:$VERSION" -t "$IMG:latest" .
          docker push "$IMG:$VERSION"; docker push "$IMG:latest"
          echo "SERVER_IMG=$IMG:$VERSION" >> "$GITHUB_ENV"
      - name: Web image (bake release QR checksum/package)
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${O}/mdmesh-web"
          docker build -f docker/web.Dockerfile \
            --build-arg VITE_AGENT_PACKAGE=com.mdmesh.agent \
            --build-arg VITE_AGENT_CHECKSUM="$CK" \
            --build-arg VITE_AGENT_APK_URL=/files/agent.apk \
            --build-arg VITE_APP_VERSION="$VERSION" \
            -t "$IMG:$VERSION" -t "$IMG:latest" .
          docker push "$IMG:$VERSION"; docker push "$IMG:latest"
          echo "WEB_IMG=$IMG:$VERSION" >> "$GITHUB_ENV"
      - name: Supervisor image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          O=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${O}/mdmesh-supervisor"
          docker build -f docker/supervisor.Dockerfile -t "$IMG:$VERSION" -t "$IMG:latest" .
          docker push "$IMG:$VERSION"; docker push "$IMG:latest"

      # --- Manifest: build + sign ---
      - name: Build + sign manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          PROTO: ${{ steps.ver.outputs.proto }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y minisign
          release/build-manifest.sh "$VERSION" stable \
            "$SERVER_IMG" "$WEB_IMG" mdmesh-agent.apk "$CODE" "$CK" "$PROTO" ambic-mdm-agent-cn.apk
          release/sign-manifest.sh manifest.json

      # --- Publish ---
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mdmesh-agent.apk
            ambic-mdm-agent-cn.apk
            manifest.json
            manifest.json.minisig
