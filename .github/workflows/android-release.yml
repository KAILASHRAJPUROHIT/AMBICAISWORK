name: Android agent release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build-signed-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore permanent signing key
        shell: bash
        env:
          MDM_RELEASE_STORE_B64: ${{ secrets.MDM_RELEASE_STORE_B64 }}
        run: |
          test -n "$MDM_RELEASE_STORE_B64"
          echo "$MDM_RELEASE_STORE_B64" | base64 --decode > "$RUNNER_TEMP/ambic-mdm-release.jks"
          chmod 600 "$RUNNER_TEMP/ambic-mdm-release.jks"

      - name: Build and test signed release
        env:
          MDM_RELEASE_STORE_FILE: ${{ runner.temp }}/ambic-mdm-release.jks
          MDM_RELEASE_STORE_PASSWORD: ${{ secrets.MDM_RELEASE_STORE_PASSWORD }}
          MDM_RELEASE_KEY_ALIAS: ${{ secrets.MDM_RELEASE_KEY_ALIAS }}
          MDM_RELEASE_KEY_PASSWORD: ${{ secrets.MDM_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon test assembleRelease \
            -PversionName="${{ inputs.version_name || github.ref_name }}" \
            -PversionCode="${{ inputs.version_code || github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ambic-mdm-agent-signed
          path: agent-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

